# Smoke test: 5-sample google/gemma-4-E2B-it run to verify the standard 4B
# model panel loads and evaluates end-to-end (used to validate a fresh VM
# bringup, e.g. `--vm vm02`). Mirrors smoke_internvl35_4b.conf / the qwen smoke.
JOB_NAME="smoke_gemma4_e2b"
DATASET_DIR="./dataset_smoke_gemma4_e2b"
export NUM_SAMPLES="5"
export DIFFICULTY="medium"
export DIFFICULTY_OVERRIDES="shortest_path=easy"
export TASKS="coloring directed_connectivity shortest_path"
export LABEL_STYLE="numeric"
export NODE_COLOR="#AED6F1"
export EDGE_STYLE="straight"
export INCLUDE_ADJ_MATRIX="1"
export MODEL_PRETRAINED="google/gemma-4-E2B-it"
export DATASET_DIR
export JOB_NAME

UPLOAD_PATHS=(
    "lmms_eval"
    "tools"
    "examples/models/dynamic_graph_benchmark"
    "pyproject.toml"
    "uv.lock"
    "setup.py"
    "README.md"
)

DATASET_UPLOAD_PATHS=(
    "src"
    "pyproject.toml"
    "uv.lock"
)

REMOTE_SETUP_CMD="uv sync && uv pip install adjustText cartopy"

REMOTE_RUN_CMD="bash examples/models/dynamic_graph_benchmark/run_eval.sh"

RESULT_PATHS=(
    "logs/${JOB_NAME}"
    "${DATASET_DIR}"
    "${DATASET_DIR}_images"
)
