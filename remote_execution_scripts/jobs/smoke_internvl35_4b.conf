# Smoke test: 5-sample InternVL3.5-4B run to verify the
# `all_tied_weights_keys` monkey-patch in lmms_eval/models/simple/internvl3.py
# loads the model successfully on VM03 under transformers 5.x.
JOB_NAME="smoke_internvl35_4b"
DATASET_DIR="./dataset_smoke_internvl35_4b"
export NUM_SAMPLES="5"
export DIFFICULTY="medium"
export DIFFICULTY_OVERRIDES="shortest_path=easy"
export TASKS="coloring directed_connectivity shortest_path"
export LABEL_STYLE="numeric"
export NODE_COLOR="#AED6F1"
export EDGE_STYLE="straight"
export INCLUDE_ADJ_MATRIX="1"
export MODEL_PRETRAINED="OpenGVLab/InternVL3_5-4B"
export DATASET_DIR
export JOB_NAME

UPLOAD_PATHS=(
    "lmms_eval"
    "tools"
    "examples/models/dynamic_graph_benchmark"
    "pyproject.toml"
    "uv.lock"
    "setup.py"
    "README.md"
)

DATASET_UPLOAD_PATHS=(
    "src"
    "pyproject.toml"
    "uv.lock"
)

REMOTE_SETUP_CMD="uv sync && uv pip install adjustText cartopy"

REMOTE_RUN_CMD="bash examples/models/dynamic_graph_benchmark/run_eval.sh"

RESULT_PATHS=(
    "logs/${JOB_NAME}"
    "${DATASET_DIR}"
    "${DATASET_DIR}_images"
)
