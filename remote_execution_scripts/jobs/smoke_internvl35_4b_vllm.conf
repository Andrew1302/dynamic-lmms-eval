# Smoke test: 5-sample InternVL3.5-4B run routed through the vllm wrapper.
# Validates whether vLLM's PagedAttention + bounded gpu_memory_utilization
# fits the 4B model + KV cache on VM03's 12 GiB RTX 4070, where the native
# InternVL3 wrapper OOMs.
JOB_NAME="smoke_internvl35_4b_vllm"
DATASET_DIR="./dataset_smoke_internvl35_4b_vllm"
export NUM_SAMPLES="5"
export DIFFICULTY="medium"
export DIFFICULTY_OVERRIDES="shortest_path=easy"
export TASKS="coloring directed_connectivity shortest_path"
export LABEL_STYLE="numeric"
export NODE_COLOR="#AED6F1"
export EDGE_STYLE="straight"
export INCLUDE_ADJ_MATRIX="1"
export MODEL_PRETRAINED="OpenGVLab/InternVL3_5-4B"
export DATASET_DIR
export JOB_NAME

# Route to the vllm wrapper instead of the native internvl3_5 wrapper.
export MODEL_NAME_OVERRIDE="vllm"

# Args for the vllm wrapper:
#   model=                       — vLLM wrapper uses `model=`, not `pretrained=`
#   gpu_memory_utilization=0.85  — hard cap on KV cache pre-allocation (12 GiB card)
#   max_model_len=8192           — cap context; lowers KV pre-allocation up front
#   enforce_eager=True           — skip CUDA graph capture (saves ~500 MiB)
#   kv_cache_dtype=fp8           — halve KV memory at small accuracy cost
#   dtype=bfloat16               — match the native run's precision
#   trust_remote_code=True       — InternVL needs its remote modeling code
export MODEL_ARGS="model=$MODEL_PRETRAINED,gpu_memory_utilization=0.93,max_model_len=4096,enforce_eager=True,kv_cache_dtype=fp8,dtype=bfloat16,trust_remote_code=True,limit_mm_per_prompt={\"image\":1}"

# SSD-backed cache env vars (XDG_CACHE_HOME, TRITON_HOME, TRITON_CACHE_DIR,
# TMPDIR, FLASHINFER_WORKSPACE_BASE) are now exported by 02_run.sh's launcher
# from config.sh defaults — no per-conf override needed.

UPLOAD_PATHS=(
    "lmms_eval"
    "tools"
    "examples/models/dynamic_graph_benchmark"
    "pyproject.toml"
    "uv.lock"
    "setup.py"
    "README.md"
)

DATASET_UPLOAD_PATHS=(
    "src"
    "pyproject.toml"
    "uv.lock"
)

REMOTE_SETUP_CMD="uv sync && uv pip install adjustText cartopy"

REMOTE_RUN_CMD="bash examples/models/dynamic_graph_benchmark/run_eval.sh"

RESULT_PATHS=(
    "logs/${JOB_NAME}"
    "${DATASET_DIR}"
    "${DATASET_DIR}_images"
)
