# CoT smoke: validates the prompting layer end to end on a small checkpoint.
# Hand-written (the generator does not emit CoT jobs yet).
JOB_NAME="cot_smoke_cot_fewshot_img_v1"
DATASET_DIR="./dataset_cot_smoke"
export NUM_SAMPLES="10"
export DIFFICULTY="hard"
export TASKS="coloring directed_connectivity shortest_path"
export PROMPT_ID="cot_fewshot_img_v1"
export MODEL_PRETRAINED="Qwen/Qwen3.5-0.8B"
export CHUNK_SIZE="0"
export DATASET_DIR
export JOB_NAME

UPLOAD_PATHS=(
    "lmms_eval"
    "prompting"
    "tools"
    "examples/models/dynamic_graph_benchmark"
    "pyproject.toml"
    "uv.lock"
    "setup.py"
    "README.md"
)

DATASET_UPLOAD_PATHS=(
    "src"
    "pyproject.toml"
    "uv.lock"
)

REMOTE_SETUP_CMD="uv sync && uv pip install adjustText cartopy"

REMOTE_RUN_CMD="bash examples/models/dynamic_graph_benchmark/run_eval.sh"

RESULT_PATHS=(
    "logs/${JOB_NAME}"
)
