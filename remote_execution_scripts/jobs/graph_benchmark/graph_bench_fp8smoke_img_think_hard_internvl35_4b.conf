# =============================================================================
# fp8fix SMOKE (image-only, tier-2/07-style, think): all 3 tasks, n=2/task, difficulty=hard
# for OpenGVLab/InternVL3_5-4B. Pre-flight validation of the fp8 vision-blindness fix
# (FP8_KEEP_BF16_PATTERNS plugin) + InternVL think force-close before the
# tier-1 (08 rerun) / tier-2 (07 rerun) campaigns. Hand-written; not managed
# by generate_graph_benchmark_jobs.py.
# =============================================================================
JOB_NAME="graph_bench_fp8smoke_img_think_hard_internvl35_4b"
DATASET_DIR="./dataset_graph_bench_fp8smoke_img_think_hard_internvl35_4b"
export NUM_SAMPLES="2"
export DIFFICULTY="hard"
export TASKS="coloring directed_connectivity shortest_path"
export LABEL_STYLE="numeric"
export NODE_COLOR="#AED6F1"
export EDGE_STYLE="straight"
export INCLUDE_ADJ_MATRIX="0"
export CHUNK_SIZE="0"
export THINKING="1"
export MODEL_PRETRAINED="OpenGVLab/InternVL3_5-4B"
export MODEL_NAME_OVERRIDE="vllm"
export INTERNVL_R1_VARIANT="internvl_r1_v1"
export DATASET_DIR
export JOB_NAME

UPLOAD_PATHS=(
    "lmms_eval"
    "tools"
    "examples/models/dynamic_graph_benchmark"
    "pyproject.toml"
    "uv.lock"
    "setup.py"
    "README.md"
)

DATASET_UPLOAD_PATHS=(
    "src"
    "pyproject.toml"
    "uv.lock"
)

REMOTE_SETUP_CMD="uv sync && uv pip install adjustText cartopy"

REMOTE_RUN_CMD="bash examples/models/dynamic_graph_benchmark/run_eval.sh"

RESULT_PATHS=(
    "logs/${JOB_NAME}"
    "${DATASET_DIR}"
    "${DATASET_DIR}_images"
)

COMPARE_PAIRS=(
    "coloring:dynamic_graph_benchmark_coloring_direct:dynamic_graph_benchmark_coloring_disguise"
    "directed_connectivity:dynamic_graph_benchmark_directed_connectivity_direct:dynamic_graph_benchmark_directed_connectivity_disguise"
    "shortest_path:dynamic_graph_benchmark_shortest_path_direct:dynamic_graph_benchmark_shortest_path_disguise"
)
