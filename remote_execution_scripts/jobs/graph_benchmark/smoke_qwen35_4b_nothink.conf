# =============================================================================
# Smoke test: tiny non-thinking Qwen3.5-4B run to verify chat_template_kwargs
# ({"enable_thinking":false}) is now forwarded by the simple vllm wrapper so
# reasoning no longer leaks into filtered_resps. Mirrors graph_bench_standard_
# qwen35_4b.conf but n=5 and unchunked.
# =============================================================================
JOB_NAME="smoke_qwen35_4b_nothink"
DATASET_DIR="./dataset_smoke_qwen35_4b_nothink"
export NUM_SAMPLES="5"
export DIFFICULTY="medium"
export DIFFICULTY_OVERRIDES="shortest_path=easy"
export TASKS="coloring directed_connectivity shortest_path"
export LABEL_STYLE="numeric"
export NODE_COLOR="#AED6F1"
export EDGE_STYLE="straight"
export INCLUDE_ADJ_MATRIX="0"
export CHUNK_SIZE="0"
export MODEL_PRETRAINED="Qwen/Qwen3.5-4B"
export DATASET_DIR
export JOB_NAME

UPLOAD_PATHS=(
    "lmms_eval"
    "tools"
    "examples/models/dynamic_graph_benchmark"
    "pyproject.toml"
    "uv.lock"
    "setup.py"
    "README.md"
)

DATASET_UPLOAD_PATHS=(
    "src"
    "pyproject.toml"
    "uv.lock"
)

REMOTE_SETUP_CMD="uv sync && uv pip install adjustText cartopy"

REMOTE_RUN_CMD="bash examples/models/dynamic_graph_benchmark/run_eval.sh"

RESULT_PATHS=(
    "logs/${JOB_NAME}"
    "${DATASET_DIR}"
    "${DATASET_DIR}_images"
)
