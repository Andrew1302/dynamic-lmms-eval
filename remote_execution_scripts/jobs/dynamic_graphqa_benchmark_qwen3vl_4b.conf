# =============================================================================
# jobs/dynamic_graphqa_benchmark_qwen3vl_4b.conf
# -----------------------------------------------------------------------------
# Generates the Dynamic Graph Benchmark dataset restricted to coloring,
# directed_connectivity, and shortest_path (direct + disguise variants per
# task) from the sibling dynamic-dataset repo and runs lmms-eval with
# Qwen3-VL-4B-Instruct against the six resulting leaf tasks.
# =============================================================================

JOB_NAME="dynamic_graphqa_benchmark_qwen3vl_4b"

# Sync the files lmms-eval needs (avoids shipping .venv, results, etc.).
UPLOAD_PATHS=(
    "lmms_eval"
    "tools"
    "examples/models/dynamic_graph_benchmark"
    "pyproject.toml"
    "uv.lock"
    "setup.py"
    "README.md"
)

# Sibling dynamic-dataset repo: only the pieces needed by
# tools/prepare_dynamic_graph_benchmark.py. Excludes .venv, out/, PDFs, caches.
DATASET_UPLOAD_PATHS=(
    "src"
    "pyproject.toml"
    "uv.lock"
)

# uv sync is idempotent; safe to re-run on every deploy. 01_deploy.sh cds into
# REMOTE_WORKDIR and activates .venv before running this, so `uv` resolves.
# `uv pip install` adds the dynamic-dataset deps that lmms-eval's pyproject
# doesn't declare (cartopy + adjustText are needed by latin_america_map.py;
# networkx/scipy come transitively via torch/scikit-learn).
REMOTE_SETUP_CMD="uv sync && uv pip install adjustText cartopy"

# 02_run.sh's launcher cds into REMOTE_WORKDIR and activates .venv before
# invoking this command, so no `cd` or env setup needed here.
REMOTE_RUN_CMD="bash examples/models/dynamic_graph_benchmark/graphqa.sh 100 medium Qwen/Qwen3-VL-4B-Instruct"

# Rsync these paths back after the run completes.
RESULT_PATHS=(0
    "logs/${JOB_NAME}"
    "dynamic_graph_benchmark_data"
    "dynamic_graph_benchmark_images"
)

# Direct/disguise pairs for ./06_compare_direct_disguise.sh.
# Format: "<sheet_label>:<direct_task_name>:<disguise_task_name>".
COMPARE_PAIRS=(
    "coloring:dynamic_graph_benchmark_coloring_direct:dynamic_graph_benchmark_coloring_disguise"
    "directed_connectivity:dynamic_graph_benchmark_directed_connectivity_direct:dynamic_graph_benchmark_directed_connectivity_disguise"
    "shortest_path:dynamic_graph_benchmark_shortest_path_direct:dynamic_graph_benchmark_shortest_path_disguise"
)
