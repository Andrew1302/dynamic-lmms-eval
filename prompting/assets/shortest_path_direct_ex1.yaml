question: 'Q: In the weighted directed acyclic graph shown, what is the minimum-weight
  path total from vertex 0 to vertex 3?

  A:'
answer: '15'
authoring_adjacency: 'Q: In the weighted directed acyclic graph shown, what is the
  minimum-weight path total from vertex 0 to vertex 3?


  Encoding: adjacency list. Adj[u] = [(v, w), ...] lists each neighbor v of node u
  and the weight w of edge (u, v).

  Adj[0] = [(1, 5), (2, 8)]

  Adj[1] = [(2, 3)]

  Adj[2] = [(3, 7)]

  Adj[3] = []


  A:'
worked_solution: 'Two arrows leave vertex 0: one to vertex 1 costing 5, one to vertex
  2 costing 8.

  Through vertex 1: 0 to 1 is 5, then 1 to 2 is 3, then 2 to 3 is 7, giving 5 + 3
  + 7 = 15.

  Straight to vertex 2: 0 to 2 is 8, then 2 to 3 is 7, giving 8 + 7 = 15.

  Both routes reach vertex 3 at a total of 15, so the minimum is 15.

  15'
