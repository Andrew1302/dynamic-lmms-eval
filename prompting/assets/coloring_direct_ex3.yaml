question: 'Q: What is the minimum number of colors needed to color this graph so that
  no two adjacent nodes share a color?

  A:'
answer: '2'
authoring_adjacency: 'Q: What is the minimum number of colors needed to color this
  graph so that no two adjacent nodes share a color?


  Provided graph adjacency list.Encoding: adjacency list. Adj[u] = [v1, v2, ...] lists
  the neighbors of node u.

  Adj[0] = [2, 4]

  Adj[1] = [3, 5, 6]

  Adj[2] = [0, 3]

  Adj[3] = [1, 2, 4]

  Adj[4] = [0, 3, 6]

  Adj[5] = [1]

  Adj[6] = [1, 4]


  A:'
worked_solution: 'First I write down, for each node, the nodes joined to it by a line:

  0: 2, 4

  1: 3, 5, 6

  2: 0, 3

  3: 1, 2, 4

  4: 0, 3, 6

  5: 1

  6: 1, 4


  Then I read that list back to check it against itself. Every pair should appear
  twice, once from each side: 0 lists 2 and 2 lists 0, 4 lists 6 and 6 lists 4, and
  so on for all eight pairs. They all do, so the list is safe to use.


  Now I try two colours. Give node 0 the first colour. Its neighbours 2 and 4 must
  take the second. Node 3 is joined to both 2 and 4, so it takes the first again.
  Node 1 is joined to 3, so it takes the second, and 5 and 6, joined to 1, take the
  first. Node 6 is also joined to 4, which holds the second colour, so the first is
  still fine there.


  That leaves 0, 3, 5 and 6 on one colour and 1, 2 and 4 on the other. Checking the
  eight lines one at a time, every line joins a node of the first colour to a node
  of the second, so no line has matching ends. Two colours are enough, and one cannot
  work once any line exists, so the minimum is 2.

  2'
