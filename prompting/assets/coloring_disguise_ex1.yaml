worked_solution: 'Region 2 shares a border with every other region on the map, so
  no other region can reuse its colour. That spends one colour on region 2 alone.

  Setting region 2 aside, the remaining borders are 0-1, 1-3, 3-6, 6-4, 4-5 and 5-0,
  which form one ring of regions: 0, 1, 3, 6, 4, 5 and back to 0. The ring has six
  regions, an even number, so two colours can simply alternate around it.

  That is 2 for the ring plus 1 for region 2, so the answer is 3.

  3'
