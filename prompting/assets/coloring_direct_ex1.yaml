question: 'Q: What is the minimum number of colors needed to color this graph so that
  no two adjacent nodes share a color?

  A:'
answer: '3'
authoring_adjacency: 'Q: What is the minimum number of colors needed to color this
  graph so that no two adjacent nodes share a color?


  Provided graph adjacency list.Encoding: adjacency list. Adj[u] = [v1, v2, ...] lists
  the neighbors of node u.

  Adj[0] = [1, 2, 5]

  Adj[1] = [0, 2, 3]

  Adj[2] = [0, 1, 3, 4, 5, 6]

  Adj[3] = [1, 2, 6]

  Adj[4] = [2, 5, 6]

  Adj[5] = [0, 2, 4]

  Adj[6] = [2, 3, 4]


  A:'
worked_solution: 'Node 2 is joined to every other node, so no other node can share
  its colour. That spends one colour on node 2 alone.

  Setting node 2 aside, the edges that remain are 0-1, 1-3, 3-6, 6-4, 4-5 and 5-0,
  which form one ring: 0, 1, 3, 6, 4, 5 and back to 0. The ring has six nodes, an
  even number, so two colours can simply alternate around it.

  That is 2 for the ring plus 1 for node 2, so the minimum is 3.

  3'
