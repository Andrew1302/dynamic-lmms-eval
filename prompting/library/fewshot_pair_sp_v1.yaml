id: fewshot_pair_sp_v1
summary: >-
  Two worked examples forming one pair: the shortest-path exemplar drawn as a plain
  graph, then the same graph disguised, with the same answer. Used on every
  task, to test whether seeing one task's graph in both framings helps another.
# Each exemplar keeps its own task's answer format (file_template.turns).
answer_style: cot
strip_answer_cue: true

exemplars:
  - "shortest_path_direct_ex1"
  - "shortest_path_disguise_ex1"

user_turn: |-
  {question}

  Think step by step about what the image shows, then answer.
  {instruction}

budget:
  max_new_tokens: 8192
  temperature: 0.6
  do_sample: true

# Three images. Worst case is shortest path on the disguised picture: two
# ~6.2k-token maps plus the plain exemplar is ~14k prompt + 8192 generation.
min_window: 24576
